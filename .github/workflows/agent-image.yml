name: Agent image

on:
    push:
        branches: [main]
        paths: ["agent/**", ".github/workflows/agent-image.yml"]
    # The release workflow pushes its tag with GITHUB_TOKEN, which starts no push workflows, so the
    # image for a release builds when the release finishes.
    workflow_run:
        workflows: [Release]
        types: [completed]
    workflow_dispatch:

permissions:
    contents: read
    packages: write

concurrency:
    group: agent-image
    cancel-in-progress: false

jobs:
    image:
        if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout sources
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  ref: ${{ github.event.repository.default_branch }}

            # Every build updates latest. A release build also gets the release version.
            - name: Choose the tags
              id: tags
              run: |
                  image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/conduit-agent"
                  tags="$image:latest"
                  if [ "${{ github.event_name }}" = "workflow_run" ]; then
                      version=$(git describe --tags --abbrev=0)
                      tags="$tags,$image:${version#v}"
                  fi
                  echo "tags=$tags" >> "$GITHUB_OUTPUT"

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3

            - name: Set up Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  context: agent
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: ${{ steps.tags.outputs.tags }}
