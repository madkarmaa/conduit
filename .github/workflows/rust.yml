name: Rust

on:
    push:
        branches: [main, "refactor/**"]
        paths: ["rust/**", "src/main/proto/**", ".github/workflows/rust.yml"]
    pull_request:
        paths: ["rust/**", "src/main/proto/**", ".github/workflows/rust.yml"]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: rust-${{ github.ref }}
    cancel-in-progress: true

defaults:
    run:
        working-directory: rust

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout sources
              uses: actions/checkout@v7

            - name: Set up Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt, clippy

            - name: Cache Rust builds
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: rust

            - name: Check formatting
              run: cargo fmt --check

            - name: Lint
              run: cargo clippy --all-targets --locked -- --deny warnings

            - name: Test
              run: cargo test --locked

    build:
        needs: check
        strategy:
            fail-fast: false
            matrix:
                include:
                    # Linux builds cross-compile with zig, and link against glibc 2.17 so they run on
                    # old distributions too.
                    - target: x86_64-unknown-linux-gnu
                      glibc: ".2.17"
                      runner: ubuntu-latest
                      zig: true
                    - target: aarch64-unknown-linux-gnu
                      glibc: ".2.17"
                      runner: ubuntu-latest
                      zig: true
                    - target: aarch64-apple-darwin
                      runner: macos-latest
                    - target: x86_64-apple-darwin
                      runner: macos-latest
                    - target: x86_64-pc-windows-msvc
                      runner: windows-latest
                    - target: aarch64-pc-windows-msvc
                      runner: windows-latest
        runs-on: ${{ matrix.runner }}
        steps:
            - name: Checkout sources
              uses: actions/checkout@v7

            - name: Set up Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}

            - name: Cache Rust builds
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: rust
                  key: ${{ matrix.target }}

            - name: Set up Zig
              if: matrix.zig
              uses: mlugg/setup-zig@v2
              with:
                  version: 0.15.1

            - name: Install cargo-zigbuild
              if: matrix.zig
              uses: taiki-e/install-action@v2
              with:
                  tool: cargo-zigbuild

            - name: Build with Zig
              if: matrix.zig
              run: cargo zigbuild --release --locked --target ${{ matrix.target }}${{ matrix.glibc }}

            - name: Build
              if: ${{ !matrix.zig }}
              run: cargo build --release --locked --target ${{ matrix.target }}

            - name: Upload the MCP server
              uses: actions/upload-artifact@v7
              with:
                  name: conduit-mcp-${{ matrix.target }}
                  path: |
                      rust/target/${{ matrix.target }}/release/conduit-mcp
                      rust/target/${{ matrix.target }}/release/conduit-mcp.exe
                  if-no-files-found: error
