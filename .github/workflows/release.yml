name: Release

on:
    workflow_dispatch:

permissions:
    contents: write
    issues: write
    pull-requests: write

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    release:
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.version.outputs.version }}
        env:
            # The release commit only changes versions, so it skips the formatting hook.
            HUSKY: "0"
        steps:
            - name: Checkout sources
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Set up Java
              uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: "25"

            - name: Set up Gradle
              uses: gradle/actions/setup-gradle@v6

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "24"

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install --frozen-lockfile

            # Bun runs the agent's runner without checking its types, so a type error stops the
            # release here.
            - name: Check the agent runner's types
              working-directory: agent
              run: bun install --frozen-lockfile && bun run check

            - name: Release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
                  SKIP_MODRINTH_RELEASE: ${{ vars.SKIP_MODRINTH_RELEASE }}
              run: bun run release

            # semantic-release tags the release commit, so the tag on HEAD names a new release.
            - name: Find the released version
              id: version
              run: |
                  tag=$(git describe --tags --exact-match HEAD 2>/dev/null || true)
                  echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

    agent-image:
        needs: release
        if: needs.release.outputs.version != ''
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - name: Checkout the release
              uses: actions/checkout@v7
              with:
                  ref: v${{ needs.release.outputs.version }}

            # GHCR only takes lowercase names.
            - name: Choose the image name
              id: image
              run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/conduit-agent" >> "$GITHUB_OUTPUT"

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v4

            - name: Set up Buildx
              uses: docker/setup-buildx-action@v4

            - name: Log in to GHCR
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push
              uses: docker/build-push-action@v7
              with:
                  context: agent
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: |
                      ${{ steps.image.outputs.name }}:latest
                      ${{ steps.image.outputs.name }}:${{ needs.release.outputs.version }}
