name: Test

on:
    push:
    pull_request:

permissions:
    contents: read

concurrency:
    group: test-${{ github.ref }}
    cancel-in-progress: true

jobs:
    mod:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout sources
              uses: actions/checkout@v7

            - name: Set up Java
              uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: "25"

            - name: Set up Gradle
              uses: gradle/actions/setup-gradle@v6

            # The build checks the formatting of the other files with bun fmt.
            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Build and test the mod
              run: ./gradlew build

    agent:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: agent
        steps:
            - name: Checkout sources
              uses: actions/checkout@v7

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Check the runner's types
              run: bun run check

            - name: Test the runner
              run: bun test
