version: v2
modules:
    - path: src/main/proto
lint:
    use:
        - STANDARD
    except:
        # The API shares small messages such as Empty, EntityRef and PlayerRef between RPCs
        # instead of declaring a request and response pair for every RPC.
        - RPC_REQUEST_RESPONSE_UNIQUE
        - RPC_REQUEST_STANDARD_NAME
        - RPC_RESPONSE_STANDARD_NAME
breaking:
    use:
        - FILE
