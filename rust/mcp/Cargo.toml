[package]
name = "conduit-mcp"
description = "MCP server that lets AI agents control Minecraft through the Conduit mod"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "conduit-mcp"
path = "src/main.rs"

[dependencies]
conduit-client.workspace = true
pbjson-types.workspace = true
rmcp = { version = "3.9.0", features = ["server", "transport-io"] }
schemars = "1.2.3"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-stream = "0.1.19"
tonic.workspace = true
