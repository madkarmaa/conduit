[workspace]
members = ["client"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "CC0-1.0"
rust-version = "1.99"

[workspace.dependencies]
conduit-client = { path = "client" }
pbjson = "0.9.0"
pbjson-types = "0.9.0"
prost = "0.14.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tokio = { version = "1.54.1", features = ["macros", "rt", "io-std", "sync", "time"] }
tonic = "0.14.9"
tonic-prost = "0.14.9"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
