syntax = "proto3";

package conduit.v1;

option java_multiple_files = true;
option java_package = "top.madkarma.conduit.proto";

message Vec3 {
    double x = 1;
    double y = 2;
    double z = 3;
}

message BlockPos {
    int32 x = 1;
    int32 y = 2;
    int32 z = 3;
}

message Rotation {
    // Degrees, Minecraft convention: yaw 0 = south, pitch -90 = up.
    float yaw = 1;
    float pitch = 2;
}

message Box {
    Vec3 min = 1;
    Vec3 max = 2;
}

// A chat component, either plain text or the JSON text component format.
message Text {
    oneof content {
        string plain = 1;
        string json = 2;
    }
}

message BlockState {
    // Block id, e.g. "minecraft:oak_stairs".
    string id = 1;
    map<string, string> properties = 2;
    // Full state in command syntax, e.g. "minecraft:oak_stairs[facing=east,half=bottom]".
    string serialized = 3;
}

message ItemStack {
    // Item id, e.g. "minecraft:diamond_sword". Empty or "minecraft:air" means an empty stack.
    string id = 1;
    int32 count = 2;
    // Data component patch as SNBT, e.g. {"minecraft:custom_name":"Excalibur"}.
    // Empty means no changes.
    string components = 3;
}

message StatusEffect {
    string id = 1;
    int32 duration = 2;
    int32 amplifier = 3;
    bool ambient = 4;
    bool visible = 5;
    bool show_icon = 6;
}

message EntityInfo {
    string uuid = 1;
    int32 network_id = 2;
    string type = 3;
    string name = 4;
    optional string custom_name = 5;
    string dimension = 6;
    Vec3 position = 7;
    Rotation rotation = 8;
    Vec3 velocity = 9;
    bool on_ground = 10;
    bool alive = 11;
    repeated string tags = 12;
    // Only set for living entities.
    optional float health = 13;
    optional float max_health = 14;
    // UUIDs of passengers and the vehicle, if any.
    repeated string passengers = 15;
    optional string vehicle = 16;
}

// Identifies a player by name or UUID string.
message PlayerRef {
    string player = 1;
}

// Identifies an entity by UUID string.
message EntityRef {
    string uuid = 1;
}

message Nbt {
    // SNBT representation.
    string snbt = 1;
}
