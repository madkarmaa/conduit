syntax = "proto3";

package conduit.v1;

import "google/protobuf/empty.proto";
import "conduit/v1/common.proto";

option java_multiple_files = true;
option java_package = "top.madkarma.conduit.proto";

// Blocks, chunks, time, weather and rules of a dimension.
// Dimension fields default to "minecraft:overworld" when empty.
service WorldService {
    rpc ListDimensions(google.protobuf.Empty) returns (DimensionList);
    rpc GetBlock(GetBlockRequest) returns (BlockInfo);
    // Reads a cuboid region (max 1,000,000 blocks) as a palette and indices
    // in x, then z, then y order.
    rpc GetBlocks(GetBlocksRequest) returns (BlockRegion);
    rpc SetBlock(SetBlockRequest) returns (google.protobuf.Empty);
    rpc SetBlocks(SetBlocksRequest) returns (SetBlocksResponse);
    rpc Fill(FillRequest) returns (SetBlocksResponse);
    rpc BreakBlock(BreakBlockRequest) returns (google.protobuf.Empty);
    rpc GetBlockEntity(GetBlockRequest) returns (Nbt);
    rpc SetBlockEntity(SetBlockEntityRequest) returns (google.protobuf.Empty);
    rpc GetBiome(GetBlockRequest) returns (Biome);
    rpc GetHeight(GetHeightRequest) returns (GetHeightResponse);
    rpc GetChunk(ChunkRequest) returns (ChunkInfo);
    rpc SetChunkForced(SetChunkForcedRequest) returns (google.protobuf.Empty);
    rpc GetTime(DimensionRef) returns (TimeInfo);
    rpc SetTime(SetTimeRequest) returns (google.protobuf.Empty);
    rpc GetWeather(DimensionRef) returns (WeatherInfo);
    rpc SetWeather(SetWeatherRequest) returns (google.protobuf.Empty);
    rpc GetGameRules(google.protobuf.Empty) returns (GameRules);
    rpc SetGameRule(SetGameRuleRequest) returns (google.protobuf.Empty);
    rpc GetSpawn(google.protobuf.Empty) returns (SpawnPoint);
    rpc SetSpawn(SpawnPoint) returns (google.protobuf.Empty);
    rpc Explode(ExplodeRequest) returns (google.protobuf.Empty);
    // Each dimension has its own world border.
    rpc GetWorldBorder(DimensionRef) returns (WorldBorderInfo);
    // Fails with INVALID_ARGUMENT for values outside the ranges the game allows.
    rpc SetWorldBorder(SetWorldBorderRequest) returns (google.protobuf.Empty);
}

message DimensionRef {
    string dimension = 1;
}

message DimensionList {
    repeated DimensionInfo dimensions = 1;
}

message DimensionInfo {
    string id = 1;
    int32 min_y = 2;
    int32 max_y = 3;
    int32 loaded_chunks = 4;
    int32 entity_count = 5;
    int32 player_count = 6;
}

message GetBlockRequest {
    string dimension = 1;
    BlockPos pos = 2;
}

message BlockInfo {
    BlockPos pos = 1;
    BlockState state = 2;
    bool has_block_entity = 3;
    bool loaded = 4;
}

message GetBlocksRequest {
    string dimension = 1;
    BlockPos from = 2;
    BlockPos to = 3;
    // Only read chunks that are already loaded. Unloaded positions report "minecraft:void_air".
    bool loaded_only = 4;
}

message BlockRegion {
    BlockPos min = 1;
    BlockPos size = 2;
    repeated BlockState palette = 3;
    repeated int32 blocks = 4 [packed = true];
}

message SetBlockRequest {
    string dimension = 1;
    BlockPos pos = 2;
    // Block state in command syntax, e.g. "minecraft:chest[facing=north]{Items:[...]}".
    string state = 3;
    // Skip neighbor updates and physics (like structure placement).
    bool no_updates = 4;
}

message BlockChange {
    BlockPos pos = 1;
    string state = 2;
}

message SetBlocksRequest {
    string dimension = 1;
    repeated BlockChange changes = 2;
    bool no_updates = 3;
}

message SetBlocksResponse {
    int32 changed = 1;
}

message FillRequest {
    string dimension = 1;
    BlockPos from = 2;
    BlockPos to = 3;
    string state = 4;
    bool no_updates = 5;
    // Only replace blocks matching this state (block id or full state).
    optional string replace = 6;
}

message BreakBlockRequest {
    string dimension = 1;
    BlockPos pos = 2;
    bool drop_items = 3;
}

message SetBlockEntityRequest {
    string dimension = 1;
    BlockPos pos = 2;
    // SNBT merged into the block entity data.
    string snbt = 3;
}

message Biome {
    string id = 1;
}

message GetHeightRequest {
    string dimension = 1;
    int32 x = 2;
    int32 z = 3;
    // One of WORLD_SURFACE, MOTION_BLOCKING, MOTION_BLOCKING_NO_LEAVES or OCEAN_FLOOR.
    // Default MOTION_BLOCKING.
    string heightmap = 4;
}

message GetHeightResponse {
    int32 y = 1;
}

message ChunkRequest {
    string dimension = 1;
    int32 chunk_x = 2;
    int32 chunk_z = 3;
}

message ChunkInfo {
    bool loaded = 1;
    bool forced = 2;
    int32 entity_count = 3;
    int32 block_entity_count = 4;
}

message SetChunkForcedRequest {
    string dimension = 1;
    int32 chunk_x = 2;
    int32 chunk_z = 3;
    bool forced = 4;
}

message TimeInfo {
    int64 game_time = 1;
    int64 day_time = 2;
    int64 day = 3;
}

message SetTimeRequest {
    string dimension = 1;
    oneof value {
        // Absolute time of day in ticks.
        int64 time = 2;
        // Adds ticks to the current time.
        int64 add = 3;
        // Named time: day, noon, night, midnight.
        string preset = 4;
    }
}

message WeatherInfo {
    bool raining = 1;
    bool thundering = 2;
}

message SetWeatherRequest {
    enum Weather {
        // Treated as clear.
        WEATHER_UNSPECIFIED = 0;
        WEATHER_RAIN = 1;
        WEATHER_THUNDER = 2;
        WEATHER_CLEAR = 3;
    }
    Weather weather = 1;
    // Duration in ticks. 0 means a random duration.
    int32 duration = 2;
}

message GameRules {
    map<string, string> rules = 1;
}

message SetGameRuleRequest {
    string name = 1;
    string value = 2;
}

message SpawnPoint {
    string dimension = 1;
    BlockPos pos = 2;
    float yaw = 3;
    float pitch = 4;
}

message ExplodeRequest {
    string dimension = 1;
    Vec3 position = 2;
    float power = 3;
    bool fire = 4;
    // NONE, BLOCK, MOB, TNT or TRIGGER. Default TNT.
    string interaction = 5;
}

message WorldBorderInfo {
    double center_x = 1;
    double center_z = 2;
    // Current side length in blocks.
    double size = 3;
    // Size the border is moving towards, or the current size when it is not moving.
    double target_size = 4;
    // Time until the border reaches the target size, at the current tick rate.
    int64 remaining_transition_ms = 5;
    double damage_per_block = 6;
    // Distance outside the border, in blocks, before players take damage.
    double damage_safe_zone = 7;
    int32 warning_blocks = 8;
    int32 warning_time_ticks = 9;
}

// Unset fields stay unchanged.
message SetWorldBorderRequest {
    string dimension = 1;
    // Between -29,999,984 and 29,999,984.
    optional double center_x = 2;
    optional double center_z = 3;
    // Between 1 and 59,999,968.
    optional double size = 4;
    // Moves the border from its current size to size over this time, converted to ticks at the
    // current tick rate. 0 changes it instantly. Requires size.
    int64 transition_ms = 5;
    // At least 0.
    optional double damage_per_block = 6;
    optional double damage_safe_zone = 7;
    optional int32 warning_blocks = 8;
    optional int32 warning_time_ticks = 9;
}
