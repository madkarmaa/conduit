syntax = "proto3";

package conduit.v1;

import "google/protobuf/empty.proto";
import "conduit/v1/common.proto";

option java_multiple_files = true;
option java_package = "top.madkarma.conduit.proto";

// Any entity, including players, addressed by UUID.
service EntityService {
    rpc ListEntities(ListEntitiesRequest) returns (EntityList);
    rpc GetEntity(EntityRef) returns (EntityInfo);
    rpc SpawnEntity(SpawnEntityRequest) returns (EntityInfo);
    rpc RemoveEntity(RemoveEntityRequest) returns (google.protobuf.Empty);
    rpc Teleport(TeleportRequest) returns (EntityInfo);
    rpc SetVelocity(SetVelocityRequest) returns (google.protobuf.Empty);
    rpc SetRotation(SetRotationRequest) returns (google.protobuf.Empty);
    rpc GetNbt(EntityRef) returns (Nbt);
    // Merges SNBT into the entity data, like /data merge entity.
    rpc MergeNbt(MergeNbtRequest) returns (google.protobuf.Empty);
    rpc SetCustomName(SetCustomNameRequest) returns (google.protobuf.Empty);
    rpc SetTags(SetTagsRequest) returns (google.protobuf.Empty);
    rpc Damage(DamageRequest) returns (google.protobuf.Empty);
    rpc SetHealth(SetHealthRequest) returns (google.protobuf.Empty);
    rpc GetEffects(EntityRef) returns (EffectList);
    rpc AddEffect(AddEffectRequest) returns (google.protobuf.Empty);
    rpc RemoveEffect(RemoveEffectRequest) returns (google.protobuf.Empty);
    rpc GetAttributes(EntityRef) returns (AttributeList);
    rpc SetAttributeBase(SetAttributeBaseRequest) returns (google.protobuf.Empty);
    rpc Mount(MountRequest) returns (google.protobuf.Empty);
    rpc Dismount(EntityRef) returns (google.protobuf.Empty);
}

message ListEntitiesRequest {
    // Empty means all dimensions.
    string dimension = 1;
    // Entity type ids, e.g. "minecraft:zombie". Empty means any type.
    repeated string types = 2;
    optional Box box = 3;
    // Distance filter around center (requires a dimension).
    optional Vec3 center = 4;
    optional double radius = 5;
    // An entity selector such as "@e[type=cow,limit=5]"; overrides other filters.
    optional string selector = 6;
    // Required scoreboard tag.
    optional string tag = 7;
    int32 limit = 8;
}

message EntityList {
    repeated EntityInfo entities = 1;
}

message SpawnEntityRequest {
    string type = 1;
    string dimension = 2;
    Vec3 position = 3;
    optional Rotation rotation = 4;
    // Optional SNBT applied on spawn, like the /summon nbt argument.
    string snbt = 5;
    // Run the natural spawn initialization (equipment, variants), like /summon without nbt.
    bool initialize = 6;
}

message RemoveEntityRequest {
    string uuid = 1;
    // Kill (drops loot, death effects) instead of silently discarding.
    bool kill = 2;
}

message TeleportRequest {
    string uuid = 1;
    // Empty means the entity's current dimension.
    string dimension = 2;
    Vec3 position = 3;
    optional Rotation rotation = 4;
}

message SetVelocityRequest {
    string uuid = 1;
    Vec3 velocity = 2;
    // Add to the current velocity instead of replacing it.
    bool add = 3;
}

message SetRotationRequest {
    string uuid = 1;
    Rotation rotation = 2;
}

message MergeNbtRequest {
    string uuid = 1;
    string snbt = 2;
}

message SetCustomNameRequest {
    string uuid = 1;
    // Unset clears the name.
    optional Text name = 2;
    bool visible = 3;
}

message SetTagsRequest {
    string uuid = 1;
    repeated string add = 2;
    repeated string remove = 3;
}

message DamageRequest {
    string uuid = 1;
    float amount = 2;
    // Damage type id, default "minecraft:generic".
    string damage_type = 3;
    // Optional attacker entity UUID.
    optional string attacker = 4;
}

message SetHealthRequest {
    string uuid = 1;
    float health = 2;
}

message EffectList {
    repeated StatusEffect effects = 1;
}

message AddEffectRequest {
    string uuid = 1;
    StatusEffect effect = 2;
}

message RemoveEffectRequest {
    string uuid = 1;
    // Empty clears all effects.
    string effect = 2;
}

message Attribute {
    string id = 1;
    double base = 2;
    double value = 3;
}

message AttributeList {
    repeated Attribute attributes = 1;
}

message SetAttributeBaseRequest {
    string uuid = 1;
    string attribute = 2;
    double base = 3;
}

message MountRequest {
    string passenger = 1;
    string vehicle = 2;
}
