syntax = "proto3";

package minecraft.grpc.v1;

import "google/protobuf/empty.proto";
import "minecraft/grpc/v1/common.proto";

option java_multiple_files = true;
option java_package = "top.madkarma.minecraft.grpc.proto";

// Server-wide control. Available on dedicated servers and while a singleplayer world is open.
service ServerService {
    rpc GetInfo(google.protobuf.Empty) returns (ServerInfo);
    rpc GetPerformance(google.protobuf.Empty) returns (Performance);
    // Runs any command, exactly like the server console or a player would.
    rpc ExecuteCommand(ExecuteCommandRequest) returns (ExecuteCommandResponse);
    rpc Broadcast(BroadcastRequest) returns (google.protobuf.Empty);
    rpc Save(SaveRequest) returns (google.protobuf.Empty);
    rpc Stop(google.protobuf.Empty) returns (google.protobuf.Empty);
    // Lists the available datapacks, including new ones in the world's datapacks folder.
    rpc ListDatapacks(google.protobuf.Empty) returns (DatapackList);
    // Enables or disables a datapack and reloads the server's data, like /datapack, then returns
    // the new list. Fails with NOT_FOUND for an unknown pack, FAILED_PRECONDITION for a pack that
    // cannot be changed and ABORTED while another reload from this API is running.
    rpc SetDatapackEnabled(SetDatapackEnabledRequest) returns (DatapackList);
    // Saves the world and zips it into the backup directory while the server keeps running.
    // Autosave is paused during the backup. Fails with ABORTED while another backup is running.
    rpc Backup(BackupRequest) returns (BackupResponse);
    rpc ListBackups(google.protobuf.Empty) returns (BackupList);
}

message ServerInfo {
    string minecraft_version = 1;
    string mod_version = 2;
    string motd = 3;
    bool dedicated = 4;
    int32 player_count = 5;
    int32 max_players = 6;
    repeated string dimensions = 7;
    int32 port = 8;
    string default_game_mode = 9;
    int64 seed = 10;
    string difficulty = 11;
    int32 tick_count = 12;
    repeated string mods = 13;
}

message Performance {
    double mspt = 1;
    double tps = 2;
    double target_tps = 3;
    bool frozen = 4;
    int64 memory_used_bytes = 5;
    int64 memory_max_bytes = 6;
}

message ExecuteCommandRequest {
    // Command with or without the leading slash.
    string command = 1;
    // Optional player (name or UUID) or entity UUID to execute as. Defaults to the server console.
    optional string as = 2;
    optional string dimension = 3;
    optional Vec3 position = 4;
    optional Rotation rotation = 5;
    // Permission level 0-4, defaults to 4 (owner).
    optional int32 permission_level = 6;
}

message ExecuteCommandResponse {
    bool success = 1;
    // Result value of the command, e.g. the number of affected entities.
    int32 result = 2;
    // Feedback messages the command produced.
    repeated string output = 3;
}

message BroadcastRequest {
    Text message = 1;
    // Show in the action bar instead of the chat.
    bool overlay = 2;
}

message SaveRequest {
    bool flush = 1;
}

message DatapackList {
    repeated Datapack datapacks = 1;
}

message Datapack {
    enum Source {
        SOURCE_UNSPECIFIED = 0;
        // Shipped with the game, such as "vanilla".
        SOURCE_BUILT_IN = 1;
        // Optional built-in packs for experimental features.
        SOURCE_FEATURE = 2;
        // From the world's datapacks folder.
        SOURCE_WORLD = 3;
        SOURCE_SERVER = 4;
        // Any other source, such as mods.
        SOURCE_OTHER = 5;
    }
    string id = 1;
    string title = 2;
    string description = 3;
    bool enabled = 4;
    // Built-in or needed by a mod, so it cannot be disabled.
    bool required = 5;
    Source source = 6;
}

message SetDatapackEnabledRequest {
    string id = 1;
    bool enabled = 2;
}

message BackupRequest {
    // Appended to the file name, at most 64 characters; characters other than A-Z, a-z, 0-9, _
    // and - become _.
    optional string name = 1;
}

message BackupResponse {
    // Absolute path of the zip file.
    string path = 1;
    int64 size_bytes = 2;
    int64 duration_ms = 3;
}

message BackupList {
    repeated BackupFile backups = 1;
}

message BackupFile {
    string name = 1;
    int64 size_bytes = 2;
    // Unix time in milliseconds.
    int64 created_timestamp_ms = 3;
}
