syntax = "proto3";

package minecraft.grpc.v1;

import "minecraft/grpc/v1/common.proto";

option java_multiple_files = true;
option java_package = "top.madkarma.minecraft.grpc.proto";

// Live stream of game events from the server side.
service EventService {
    rpc Subscribe(SubscribeRequest) returns (stream Event);
}

enum EventType {
    EVENT_TYPE_UNSPECIFIED = 0;
    EVENT_TYPE_CHAT = 1;
    EVENT_TYPE_PLAYER_JOIN = 2;
    EVENT_TYPE_PLAYER_LEAVE = 3;
    EVENT_TYPE_PLAYER_RESPAWN = 4;
    EVENT_TYPE_BLOCK_BREAK = 5;
    EVENT_TYPE_BLOCK_PLACE = 6;
    EVENT_TYPE_BLOCK_USE = 7;
    EVENT_TYPE_ENTITY_DAMAGE = 8;
    EVENT_TYPE_ENTITY_DEATH = 9;
    EVENT_TYPE_ENTITY_ATTACK = 10;
    EVENT_TYPE_PLAYER_CHANGE_DIMENSION = 11;
    EVENT_TYPE_COMMAND = 12;
    EVENT_TYPE_SERVER_TICK = 13;
    EVENT_TYPE_SERVER_STARTED = 14;
    EVENT_TYPE_SERVER_STOPPING = 15;
    EVENT_TYPE_PLAYER_MOVE = 16;
    EVENT_TYPE_ENTITY_SPAWN = 17;
    EVENT_TYPE_ENTITY_REMOVE = 18;
    EVENT_TYPE_CHUNK_LOAD = 19;
    EVENT_TYPE_CHUNK_UNLOAD = 20;
    EVENT_TYPE_ADVANCEMENT = 21;
    EVENT_TYPE_INVENTORY_CHANGE = 22;
    EVENT_TYPE_ITEM_PICKUP = 23;
    // Items a player drops or throws, including the items dropped on death and the items GiveItem
    // could not fit into the inventory.
    EVENT_TYPE_ITEM_DROP = 24;
    EVENT_TYPE_ITEM_CRAFT = 25;
    EVENT_TYPE_ITEM_SMELT = 26;
    EVENT_TYPE_TRADE = 27;
}

message SubscribeRequest {
    // Event types to receive. Empty means all except the high-volume types EVENT_TYPE_SERVER_TICK,
    // EVENT_TYPE_PLAYER_MOVE, EVENT_TYPE_ENTITY_SPAWN, EVENT_TYPE_ENTITY_REMOVE,
    // EVENT_TYPE_CHUNK_LOAD, EVENT_TYPE_CHUNK_UNLOAD and EVENT_TYPE_INVENTORY_CHANGE, which are only
    // sent when listed.
    repeated EventType types = 1;
    // Only send EVENT_TYPE_SERVER_TICK every N ticks (default 20).
    int32 tick_interval = 2;

    // EVENT_TYPE_PLAYER_MOVE is sent at most once per tick for each player: the first time, then
    // whenever one of the thresholds below is reached since the last event sent for that player,
    // or the player changed dimension.

    // Blocks moved (default 1.0).
    double move_min_distance = 3;
    // Degrees of yaw or pitch turned. 0 means rotation alone does not send an event.
    float move_min_rotation = 4;
    // Ticks passed, so that players standing still are reported too. 0 means no heartbeat.
    int32 move_heartbeat_ticks = 5;

    // Only send events about these players, by name or UUID. Empty means all players.
    // Applies to EVENT_TYPE_PLAYER_MOVE, EVENT_TYPE_ADVANCEMENT, EVENT_TYPE_INVENTORY_CHANGE,
    // EVENT_TYPE_ITEM_PICKUP, EVENT_TYPE_ITEM_DROP, EVENT_TYPE_ITEM_CRAFT, EVENT_TYPE_ITEM_SMELT and
    // EVENT_TYPE_TRADE.
    repeated string players = 6;

    // Only send EVENT_TYPE_ENTITY_SPAWN and EVENT_TYPE_ENTITY_REMOVE for these entity types, e.g.
    // "minecraft:zombie". Empty means all types except item entities, experience orbs and players,
    // which are only sent when listed.
    repeated string entity_types = 7;

    // Also send EVENT_TYPE_ADVANCEMENT for recipe advancements (ids starting with "recipes/"),
    // which players earn constantly by picking up items.
    bool include_recipe_advancements = 8;
}

message Event {
    int64 timestamp_ms = 1;
    // Server tick count at the time of the event.
    int32 tick = 2;
    oneof payload {
        ChatEvent chat = 10;
        PlayerEvent player_join = 11;
        PlayerEvent player_leave = 12;
        PlayerEvent player_respawn = 13;
        BlockEvent block_break = 14;
        BlockEvent block_place = 15;
        BlockEvent block_use = 16;
        EntityDamageEvent entity_damage = 17;
        EntityDeathEvent entity_death = 18;
        EntityAttackEvent entity_attack = 19;
        DimensionChangeEvent player_change_dimension = 20;
        CommandEvent command = 21;
        TickEvent server_tick = 22;
        LifecycleEvent server_started = 23;
        LifecycleEvent server_stopping = 24;
        PlayerMoveEvent player_move = 25;
        EntitySpawnEvent entity_spawn = 26;
        EntityRemoveEvent entity_remove = 27;
        ChunkEvent chunk_load = 28;
        ChunkEvent chunk_unload = 29;
        AdvancementEvent advancement = 30;
        InventoryChangeEvent inventory_change = 31;
        ItemEntityEvent item_pickup = 32;
        ItemEntityEvent item_drop = 33;
        ItemCraftEvent item_craft = 34;
        ItemCraftEvent item_smelt = 35;
        TradeEvent trade = 36;
    }
}

message ChatEvent {
    string player = 1;
    string player_uuid = 2;
    string message = 3;
}

message PlayerEvent {
    string player = 1;
    string player_uuid = 2;
    string dimension = 3;
    Vec3 position = 4;
}

message PlayerMoveEvent {
    string player = 1;
    string player_uuid = 2;
    string dimension = 3;
    Vec3 position = 4;
    Rotation rotation = 5;
    // Blocks per tick, as last reported by the client.
    Vec3 velocity = 6;
    bool on_ground = 7;
    // The server moved the player during this tick (teleport, respawn, dimension change, joining)
    // instead of the player walking, flying or riding there.
    bool teleported = 8;
}

message BlockEvent {
    string player = 1;
    string player_uuid = 2;
    string dimension = 3;
    BlockPos pos = 4;
    BlockState state = 5;
    // Item in the hand used, for place and use events.
    optional ItemStack item = 6;
}

message EntityDamageEvent {
    EntityInfo entity = 1;
    string damage_type = 2;
    float amount = 3;
    optional string attacker_uuid = 4;
}

message EntityDeathEvent {
    EntityInfo entity = 1;
    string damage_type = 2;
    string death_message = 3;
    optional string attacker_uuid = 4;
}

message EntityAttackEvent {
    string player = 1;
    string player_uuid = 2;
    EntityInfo target = 3;
}

message DimensionChangeEvent {
    string player = 1;
    string player_uuid = 2;
    string from = 3;
    string to = 4;
}

// A new entity was added to the world. Entities loaded with their chunk are not reported.
message EntitySpawnEvent {
    EntityInfo entity = 1;
    // How a mob or other entity type was created, e.g. "natural", "breeding" or "command". Not set
    // for entities the game creates directly, such as projectiles and dropped items.
    optional string spawn_reason = 2;
}

enum RemovalReason {
    REMOVAL_REASON_UNSPECIFIED = 0;
    REMOVAL_REASON_KILLED = 1;
    REMOVAL_REASON_DISCARDED = 2;
    REMOVAL_REASON_UNLOADED_TO_CHUNK = 3;
    REMOVAL_REASON_UNLOADED_WITH_PLAYER = 4;
    REMOVAL_REASON_CHANGED_DIMENSION = 5;
}

message EntityRemoveEvent {
    EntityInfo entity = 1;
    RemovalReason reason = 2;
}

message ChunkEvent {
    string dimension = 1;
    int32 chunk_x = 2;
    int32 chunk_z = 3;
}

enum AdvancementFrame {
    ADVANCEMENT_FRAME_UNSPECIFIED = 0;
    ADVANCEMENT_FRAME_TASK = 1;
    ADVANCEMENT_FRAME_GOAL = 2;
    ADVANCEMENT_FRAME_CHALLENGE = 3;
}

// A player completed an advancement.
message AdvancementEvent {
    string player = 1;
    string player_uuid = 2;
    string id = 3;
    // Title and frame are empty for advancements without a display, such as recipes.
    string title = 4;
    AdvancementFrame frame = 5;
    // The advancement is announced in chat, unless the game rule for advancement messages is off.
    bool announced = 6;
}

// A slot of a player's inventory changed. Inventories are compared once per tick, so several
// changes to one slot within a tick are combined into one event, and a change that is undone
// within the same tick is not reported.
message InventoryChangeEvent {
    string player = 1;
    string player_uuid = 2;
    // Same numbering as PlayerService: 0-8 hotbar, 9-35 main, 36-39 armor, 40 offhand.
    int32 slot = 3;
    ItemStack old_item = 4;
    ItemStack new_item = 5;
}

// A player picked up or dropped an item entity.
message ItemEntityEvent {
    string player = 1;
    string player_uuid = 2;
    // For pickups, only the part that fit into the inventory.
    ItemStack item = 3;
    string item_entity_uuid = 4;
    // Only for EVENT_TYPE_ITEM_DROP: the item was dropped because the player died, from the
    // inventory, the equipment, the crafting grid or the cursor.
    bool death = 5;
}

// A player took the result out of a crafting grid or a furnace, blast furnace or smoker. Taking
// several batches with one shift-click is reported as one event with the total.
message ItemCraftEvent {
    string player = 1;
    string player_uuid = 2;
    // The item taken, with the total count.
    ItemStack result = 3;
    // Recipe used, e.g. "minecraft:crafting_table". Not set for smelting.
    optional string recipe_id = 4;
    // Number of items taken.
    int32 count = 5;
}

// A player traded with a villager or another merchant. Every trade is reported on its own, also
// when one shift-click trades several times.
message TradeEvent {
    string player = 1;
    string player_uuid = 2;
    // Not set when the merchant is not an entity.
    optional string merchant_uuid = 3;
    ItemStack cost_a = 4;
    optional ItemStack cost_b = 5;
    ItemStack result = 6;
}

message CommandEvent {
    string source = 1;
    string command = 2;
}

message TickEvent {
    double mspt = 1;
    int32 player_count = 2;
}

message LifecycleEvent {}
